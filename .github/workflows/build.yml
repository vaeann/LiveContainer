name: Build IPA

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '合并上游的 ref。留空 = 直接构建当前代码；填 main / tag = 先合并再构建'
        required: false
        type: string
        default: ''
      create_release:
        description: '构建完成后创建 GitHub Release'
        required: false
        type: boolean
        default: true
      strip_symbols:
        description: '对产物做 strip 瘦身（会丢失崩溃符号，排错时请关掉）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: LiveContainer/LiveContainer
  SCHEME: LiveContainer
  ARCHIVE_PATH: archive

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream
        if: inputs.upstream_ref != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 让 .gitattributes 的 merge=ours 生效：本仓库的 workflow / README 不被上游覆盖
          git config merge.ours.driver true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --force
          if ! git merge --no-edit "upstream/${{ inputs.upstream_ref }}"; then
            echo "::error::上游合并冲突，需要手动解决后再触发构建"
            echo "冲突文件："
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "合并完成，当前 HEAD："
          git log --oneline -5

      - name: Persist merge to repository
        if: inputs.upstream_ref != ''
        continue-on-error: true
        run: |
          # 把合并结果推回仓库，保证 Release 附件对应的源码在仓库里可查（AGPL 要求）。
          # 推送失败不影响构建，只提示。
          git push origin "HEAD:${{ github.ref_name }}" \
            || echo "::warning::合并结果未能推送到仓库，请本地 merge 后 push"

      - name: Checkout submodules
        run: |
          # merge 上游后 .gitmodules 可能变了，先同步 URL 再拉取
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Bump build number
        run: |
          PLIST="LiveContainer/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          # 版本号按固定宽度展开：3.8.11 -> 30811，3.9.0 -> 30900，保证单调递增。
          # 不能直接去掉小数点，那样 3.9.0 会变成 390，反而小于 3.8.11 的 3811。
          BV=$(python3 - "$SHORT" "$GITHUB_RUN_NUMBER" <<'PY'
          import re, sys
          v, run = sys.argv[1], sys.argv[2]
          m = re.match(r'(\d+)(?:\.(\d+))?(?:\.(\d+))?', v)
          a, b, c = (int(x) if x else 0 for x in (m.groups() if m else (0, 0, 0)))
          print(f"{a}{b:02d}{c:02d}.{run}")
          PY
          )
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BV}" "$PLIST"
          echo "SHORT_VERSION=${SHORT}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BV}"     >> "$GITHUB_ENV"
          echo "CFBundleShortVersionString = ${SHORT}"
          echo "CFBundleVersion            = ${BV}"

      - name: Ensure xcpretty
        run: gem install xcpretty --no-document || true

      - name: Archive
        run: |
          xcodebuild archive \
            -archivePath "$ARCHIVE_PATH" \
            -scheme "$SCHEME" \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            2>&1 | tee archive-raw.log | xcpretty
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "=== RAW ERRORS ==="
            grep "error:" archive-raw.log | head -40
          fi
          exit $code

      - name: Package IPA
        env:
          STRIP_SYMBOLS: ${{ inputs.strip_symbols }}
        run: bash scripts/make-ipa.sh "$ARCHIVE_PATH" "$SCHEME.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-${{ env.SHORT_VERSION }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: LiveContainer.ipa
          retention-days: 30

      - name: Create Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SHORT_VERSION }}-${{ github.run_number }}
          name: ${{ env.SHORT_VERSION }} (build ${{ github.run_number }})
          files: LiveContainer.ipa
          draft: false
          prerelease: false
          body: |
            **未签名 IPA** —— 需自行用 AltStore / SideStore / Sideloadly 签名安装。

            - 版本：`${{ env.SHORT_VERSION }}`
            - CFBundleVersion：`${{ env.BUILD_VERSION }}`
            - Bundle ID：`com.kdt.livecontainer`（与上游一致，可直接覆盖安装）
            - 上游：`${{ env.UPSTREAM_REPO }}`
            - 构建 commit：`${{ github.sha }}`
            - 合并方式：${{ inputs.upstream_ref == '' && '直接构建' || format('先合并上游 {0}', inputs.upstream_ref) }}

            > 必须用**与已安装版本相同的 Apple ID** 签名，否则数据无法保留。
