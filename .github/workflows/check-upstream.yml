name: Check upstream commit

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: LiveContainer/LiveContainer

jobs:
  check:
    name: Compare upstream commit vs local release
    runs-on: ubuntu-latest
    steps:
      - name: Read upstream main
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/main" --jq '.sha' 2>/dev/null || echo "")
          DATE=$(gh api "repos/${UPSTREAM_REPO}/commits/main" --jq '.commit.committer.date' 2>/dev/null || echo "")
          MSG=$(gh api "repos/${UPSTREAM_REPO}/commits/main" --jq '.commit.message' 2>/dev/null | head -1 || echo "")
          {
            echo "sha=${SHA}"
            echo "date=${DATE}"
            echo "msg=${MSG}"
          } >> "$GITHUB_OUTPUT"
          echo "upstream main: ${SHA:0:7}  ${DATE}  ${MSG}"

      - name: Read local latest release
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.created_at' 2>/dev/null || echo "1970-01-01T00:00:00Z")
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "local latest release: ${DATE}"

      - name: Open notification issue
        if: ${{ steps.up.outputs.date != '' && steps.up.outputs.date > steps.local.outputs.date }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UP_SHA: ${{ steps.up.outputs.sha }}
          UP_DATE: ${{ steps.up.outputs.date }}
          UP_MSG: ${{ steps.up.outputs.msg }}
          LOCAL_DATE: ${{ steps.local.outputs.date }}
        run: |
          TITLE="上游有新提交，可以重新构建"
          COUNT=$(gh issue list --repo "${{ github.repository }}" \
            --search "${TITLE} in:title" --state open --json number --jq 'length')
          if [ "$COUNT" != "0" ]; then
            echo "already has an open issue, skip"
            exit 0
          fi

          BODY="上游 ${UPSTREAM_REPO} 有比上次构建更新的提交。

          上游 commit: ${UP_SHA:0:7}
          提交时间:    ${UP_DATE}
          上次构建:    ${LOCAL_DATE}
          提交信息:    ${UP_MSG}

          怎么应用：

          1. 打开 Actions -> Build IPA
          2. 点 Run workflow
          3. upstream_ref 填 main
          4. create_release 保持勾选
          5. 运行

          工作流会先合并上游 main，把结果推回仓库，再构建未签名 IPA 并发布 Release。
          如果出现冲突，Merge upstream 那一步会失败并列出冲突文件。

          构建前提醒：
          - CFBundleVersion 会自动递增，保证能覆盖安装
          - Bundle ID 保持 com.kdt.livecontainer 不变
          - 签名必须用和已装版本相同的 Apple ID
          - 只出单版本，不含 LiveContainer+SideStore.ipa

          注：官方 Release tag 固定为 1.0 / nightly，所以这里按 commit 时间判断更新，不看 tag。"

          gh issue create --repo "${{ github.repository }}" \
            --title "${TITLE}" \
            --body "${BODY}"
